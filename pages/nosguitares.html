<body>
   
   
    <div class="hero-scene text-center text-white">
        <div class="hero-scene-content">
            <h1>Notre Sélection de guitares</h1>
        </div>
    </div>
    
    <section class="container my-5">
        <h2 class="text-center mb-4">Nos Guitares à Vendre</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="galerie">
            <!-- Les cartes seront ajoutées ici dynamiquement par JavaScript -->
        </div>
    </section>

    <div id="footer"></div>
    
    <!-- Modals -->
   <!-- Modale d'édition -->
<div class="modal fade" id="EditionPhotoModal" tabindex="-1" aria-labelledby="EditionPhotoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="EditionPhotoModalLabel">Modifier la guitare</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="guitarId"> <!-- ID de la guitare -->
                <div class="mb-3">
                    <label for="NamePhotoInput" class="form-label">Nom de la guitare</label>
                    <input type="text" class="form-control" id="NamePhotoInput">
                </div>
                <div class="mb-3">
                    <label for="CardTextInput" class="form-label">Description</label>
                    <textarea class="form-control" id="CardTextInput"></textarea>
                </div>
                <div class="mb-3">
                    <img id="EditionPhotoModalImage" src="" alt="Image de la guitare" class="img-fluid">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary" id="saveChangesBtn">Sauvegarder les modifications</button>
            </div>
        </div>
    </div>
</div>

    
    <!-- Modal suppression photo -->
    <div class="modal fade" id="DeletePhotoModal" tabindex="-1" aria-labelledby="DeletePhotoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="DeletePhotoModalLabel">Confirmer la suppression de la photo ?</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <img src="" class="w-100" alt="supprimer">
                        </div>
                        <div class="text-center">
                            <button type="button" class="btn btn-primary text-danger">Supprimer</button>
                            <button type="button" data-bs-dismiss="modal" class="btn btn-primary text-secondary">Annuler</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Acheter -->
    <div class="modal fade" id="AchatModal" tabindex="-1" aria-labelledby="AchatModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="AchatModalLabel">Détails de l'achat</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center">
                        <img id="AchatModalImage"  class="img-fluid mb-3" alt="Image guitare">
                        <h5 id="AchatModalTitle">Nom de la guitare</h5>
                        <p id="AchatModalDescription">Description</p>
                        <p id="AchatModalPrice" class="fw-bold">Prix</p>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Retour</button>
                        <button type="button" class="btn btn-primary" id="AddToCartBtn">Ajouter au panier</button>
                    </div>
                </div>
            </div>
        </div>
    </div>




<script src="/js/nosguitares.js"></script>
